services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventariowm-app
    ports:
      - "8081:80"
    env_file:
      - .env
    environment:
      APP_URL: http://localhost:8081
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      DB_FOREIGN_KEYS: "true"
      CACHE_STORE: file
      SESSION_DRIVER: file
    volumes:
      - ./database:/var/www/html/database
      - inventariowm_storage:/var/www/html/storage
    restart: unless-stopped

volumes:
  inventariowm_storage:
